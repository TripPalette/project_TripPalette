{% extends "base.html" %}

{% block title %}비밀번호 찾기 | TripPalette{% endblock %}

{% block content %}
<div class="page-section">
    <div class="container">
        <h1 class="page-title">비밀번호 찾기</h1>

        <div class="content">
            <p>가입한 이메일을 입력해주세요.</p>

            <form>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="이메일을 입력해주세요"
                    >
                </div>

                <button type="submit">비밀번호 재설정</button>
            </form>

            <div class="page-links">
                <a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
