{% extends "base.html" %}

{% block title %}로그인 | TripPalette{% endblock %}

{% block content %}
<div class="page-section">
    <div class="container">
        <h1 class="page-title">로그인</h1>

        <div class="content">
          <form method="post" action="{{ url_for('auth.login') }}">
            {% if next_url %}
             <input
                  type="hidden"
                 name="next"
                  value="{{ next_url }}"
        >
              {% endif %}

              <div class="form-group">
                  <label for="email">이메일</label>
                      <input
                      type="email"
                          id="email"
                          name="email"
                         value="{{ form_data.get('email', '') }}"
                         placeholder="이메일을 입력해주세요"
                          autocomplete="email"
                  required
                        >
             </div>

             <div class="form-group">
                <label for="password">비밀번호</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    autocomplete="current-password"
                    required
                    >
             </div>

            <button class="button button--primary" type="submit">
                로그인
            </button>
        </form>

            <div class="page-links">
                <a href="{{ url_for('auth.signup') }}">회원가입</a>
                <a href="{{ url_for('auth.find_email') }}">이메일 찾기</a>
                <a href="{{ url_for('auth.reset_password') }}">비밀번호 찾기</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
