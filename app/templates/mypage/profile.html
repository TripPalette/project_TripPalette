{% extends "base.html" %}

{% block title %}프로필 | TripPalette{% endblock %}

{% block content %}
<div class="page-section">
    <div class="container">
        <h1 class="page-title">프로필</h1>

        <div class="content">
            <div class="form-group">
                <label for="name">이름</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="이름"
                >
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="이메일"
                >
            </div>

            <button type="button">프로필 수정</button>
        </div>
    </div>
</div>
{% endblock %}
