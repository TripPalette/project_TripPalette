{% extends "base.html" %}

{% block title %}TripPalette{% endblock %}

{% block content %}
<div class="header">
    <div class="inner">
        <img src="{{ url_for('static', filename='img/base/logo.png') }}" alt="logo">

        <div class="nav">
            <a href="#">여행지</a>
            <a href="#">맞춤추천</a>
            <a href="#">찜</a>
            <a href="#">마이페이지</a>
        </div>

        <div class="search">
            <input type="text" placeholder="검색어를 입력하세요.">
            <img src="{{ url_for('static', filename='img/base/search.svg') }}" alt="search">
        </div>
    </div>
</div>

<!-- Swiper -->
<div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide">Slide 1</div>
        <div class="swiper-slide">Slide 2</div>
        <div class="swiper-slide">Slide 3</div>
        <div class="swiper-slide">Slide 4</div>
        <div class="swiper-slide">Slide 5</div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
</div>

<div class="content">
</div>


<div class="footer">

</div>
{% endblock %}
